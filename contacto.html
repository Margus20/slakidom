<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contáctanos para hacer tu pedido - SLAKIDOM">
    <title>Contacto - SLAKIDOM</title>
    
    <link rel="icon" type="image/png" href="img/slaky_cuadrado.jpg">
    
    <!-- CSS MODULAR -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header-menu.css">
    <link rel="stylesheet" href="css/08-como-pedir.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">
</head>
<body>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL HEADER -->
    <div id="header-container"></div>
    
    <main>
        <!-- SECCIÓN CÓMO PEDIR / CONTACTO -->
        <section class="como-pedir" style="padding-top: 40px;">
            <h2 class="section-title" style="text-align: center; margin-bottom: 10px;">¿Cómo Pedir? 📱</h2>
            <p style="text-align: center; color: #666; margin-bottom: 50px; font-size: 1.1rem;">Es muy fácil, sigue estos 3 pasos</p>
            
            <div class="pasos-pedir">
                <div class="paso-pedir">
                    <div class="paso-icono">1️</div>
                    <h3>Elige</h3>
                    <p>Tus galletas o mermeladas favoritas</p>
                </div>
                <div class="paso-pedir">
                    <div class="paso-icono">2️⃣</div>
                    <h3>Escríbenos</h3>
                    <p>Al WhatsApp 0412-2879803</p>
                </div>
                <div class="paso-pedir">
                    <div class="paso-icono">3️⃣</div>
                    <h3>Recibe</h3>
                    <p>Tu pedido en Caracas</p>
                </div>
            </div>
            
            <!-- Información de contacto adicional -->
            <div style="margin-top: 60px; text-align: center; padding: 40px 20px; background: var(--amarillo); border-radius: 15px;">
                <h3 style="color: var(--chocolate); margin-bottom: 20px; font-size: 1.8rem;">Contáctanos</h3>
                <p style="font-size: 1.2rem; margin: 10px 0;">
                    📱 <strong>WhatsApp:</strong> 0412-2879803
                </p>
                <p style="font-size: 1.2rem; margin: 10px 0;">
                    📍 <strong>Ubicación:</strong> Caracas, Venezuela
                </p>
                <p style="font-size: 1rem; color: #666; margin-top: 30px;">
                    ¡Estamos listos para atenderte! 🍪
                </p>
            </div>
        </section>
    </main>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL FOOTER -->
    <div id="footer-container"></div>

    <!-- ✅ SCRIPT PRINCIPAL -->
    <script type="module" src="js/app.js"></script>
    
</body>
</html>
