<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contáctanos para hacer tu pedido - SLAKIDOM">
    <title>Contacto - SLAKIDOM</title>
    
    <link rel="icon" type="image/png" href="img/slaky_cuadrado.jpg">
    
    <!-- CSS MODULAR (Actualizado con la nueva estructura) -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header.css">
    <link rel="stylesheet" href="css/11-menu.css">
    <link rel="stylesheet" href="css/08-como-pedir.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">
    
    <!-- ✅ ESTILOS ESPECÍFICOS PARA ESTA PÁGINA -->
    <style>
        /* ✅ FONDO BLANCO PARA LA SECCIÓN CENTRAL */
        .como-pedir {
            background-color: var(--blanco, #FFFFFF) !important;
            padding: 60px 20px;
        }
        
        /* ✅ CONTENEDOR DE LOS PASOS - FORZADO 3 COLUMNAS EN ESCRITORIO */
        .pasos-pedir {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        .paso-pedir {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* ✅ IMÁGENES EN LUGAR DE NÚMEROS */
        .paso-imagen {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .paso-imagen:hover {
            transform: scale(1.05);
        }
        
        .paso-pedir h3 {
            font-family: 'Bowlby One SC', cursive, sans-serif;
            font-size: 28px;
            color: var(--chocolate);
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        /* ✅ TEXTO CON TAMAÑO UNIFICADO 26PX */
        .paso-pedir p {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            font-weight: 700;
            color: var(--chocolate);
            line-height: 1.4;
            margin: 0;
        }
        
        /* ✅ BLOQUE DE CONTACTO: SOLO MENSAJE FINAL */
        .contacto-bloque {
            margin-top: 80px;
            text-align: center;
            padding: 40px 30px;
            background: var(--blanco, #FFFFFF) !important;
            border-radius: 20px;
            border: 3px solid var(--amarillo, #FFD700);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .contacto-bloque .mensaje-final {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            font-weight: 700;
            color: var(--chocolate);
            margin: 0;
            line-height: 1.4;
        }
        
        /* ✅ RESPONSIVE */
        @media (max-width: 992px) {
            .paso-imagen {
                width: 180px;
                height: 180px;
            }
            .paso-pedir h3 {
                font-size: 26px;
            }
            .paso-pedir p {
                font-size: 26px;
            }
        }
        
        @media (max-width: 768px) {
            .pasos-pedir {
                grid-template-columns: 1fr;
                gap: 50px;
            }
            .paso-imagen {
                width: 150px;
                height: 150px;
            }
            .paso-pedir h3 {
                font-size: 24px;
            }
            .paso-pedir p {
                font-size: 22px;
            }
            .contacto-bloque .mensaje-final {
                font-size: 22px;
            }
        }
        
        @media (max-width: 480px) {
            .como-pedir {
                padding: 40px 15px;
            }
            .pasos-pedir {
                gap: 40px;
            }
            .paso-imagen {
                width: 120px;
                height: 120px;
            }
            .paso-pedir h3 {
                font-size: 22px;
            }
            .paso-pedir p {
                font-size: 18px;
            }
            .contacto-bloque {
                padding: 30px 20px;
                margin-top: 60px;
            }
            .contacto-bloque .mensaje-final {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL HEADER -->
    <div id="header-container"></div>
    
    <main>
        <!-- SECCIÓN CÓMO PEDIR / CONTACTO -->
        <section class="como-pedir">
            <h2 class="section-title">¿Cómo Pedir?</h2>
            <p class="section-subtitle">Es muy fácil, sigue estos 3 pasos</p>
            
            <div class="pasos-pedir">
                <!-- ✅ Paso 1: Imagen ELIGE -->
                <div class="paso-pedir">
                    <img src="img/elige.jpg" alt="Elige tus productos" class="paso-imagen">
                    <h3>Elige</h3>
                    <p>Tus galletas o mermeladas favoritas</p>
                </div>
                
                <!-- ✅ Paso 2: Imagen ESCRIBE -->
                <div class="paso-pedir">
                    <img src="img/escribe.jpg" alt="Escríbenos por WhatsApp" class="paso-imagen">
                    <h3>Escríbenos</h3>
                    <p>Al WhatsApp<br>0412-2879803</p>
                </div>
                
                <!-- ✅ Paso 3: Imagen RECIBE -->
                <div class="paso-pedir">
                    <img src="img/recibe.jpg" alt="Recibe tu pedido" class="paso-imagen">
                    <h3>Recibe</h3>
                    <p>Tu pedido en Caracas</p>
                </div>
            </div>
            
            <!-- ✅ CUADRO DE CONTACTO: SOLO MENSAJE FINAL -->
            <div class="contacto-bloque">
                <p class="mensaje-final">¡Estamos listos para atenderte!</p>
            </div>
        </section>
    </main>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL FOOTER -->
    <div id="footer-container"></div>

    <!-- ✅ SCRIPT PRINCIPAL -->
    <script type="module" src="js/app.js"></script>
    
</body>
</html>
