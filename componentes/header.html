<!-- HEADER / NAVEGACIÓN -->
<header class="header">
    <div class="logo-container">
        <!-- ✅ Ruta absoluta incluyendo el nombre del repositorio -->
        <a href="/slakidom/index.html" class="logo-link" title="Volver al inicio">
            <img src="/slakidom/img/slaky_logo.png" alt="SLAKIDOM Logo" class="logo">
        </a>
    </div>
    
    <div class="header-botones">
        <!-- Selector de moneda y Ubicación (izquierda) -->
        <div class="selector-moneda-wrapper">
            <button class="selector-moneda" id="selectorMoneda" aria-label="Cambiar moneda">
                <span class="bandera">🇻🇪</span>
                <span class="moneda-actual">Venezuela ($)</span>
                <span class="flecha">▼</span>
            </button>
            <div class="dropdown-monedas" id="dropdownMonedas">
                <div class="opcion-moneda seleccionada" data-moneda="USD" data-simbolo="$">
                    <span>💵</span>
                    <span>Dólares ($)</span>
                </div>
                <div class="opcion-moneda" data-moneda="VES" data-simbolo="Bs.">
                    <span>💰</span>
                    <span>Bolívares (Bs.)</span>
                </div>
            </div>
            <div class="ubicacion">
                <span class="icono-ubicacion">📍</span>
                <span>Caracas</span>
            </div>
            <!-- ✅ TASA BCV: Color negro y en negritas -->
            <div class="tasa-bcv-info" id="tasaBcvInfo" style="font-size: 0.8rem; color: #000000; font-weight: 700; padding: 2px 12px 8px 12px;"></div>
        </div>
        
        <!-- Buscador (derecha) -->
        <div class="buscador-header">
            <input type="text" id="buscador-input" class="buscador-input" placeholder="Buscar..." aria-label="Buscar productos">
            <button class="buscador-btn" id="buscador-btn" aria-label="Buscar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- ✅ MENÚ HORIZONTAL: Productos como dropdown selector -->
    <nav class="nav-bar">
        <ul class="nav-list">
            <li class="nav-item">
                <!-- ✅ CAMBIO 1: Se eliminó el span de la flecha para evitar la duplicidad (el CSS ya la agrega) -->
                <button class="nav-link nav-dropdown-toggle" id="navProductosToggle">
                    Productos
                </button>
                <ul class="nav-dropdown" id="navProductosDropdown">
                    <!-- ✅ CAMBIO 2: Se agregó onclick para cerrar el menú inmediatamente al seleccionar -->
                    <li><a href="/slakidom/galletas/" class="dropdown-link" onclick="document.getElementById('navProductosDropdown').classList.remove('activo'); document.getElementById('navProductosToggle').classList.remove('activo');">Galletas</a></li>
                    <li><a href="/slakidom/mermeladas/" class="dropdown-link" onclick="document.getElementById('navProductosDropdown').classList.remove('activo'); document.getElementById('navProductosToggle').classList.remove('activo');">Mermeladas</a></li>
                </ul>
            </li>
            <li class="nav-item"><a href="/slakidom/proceso.html" class="nav-link">Nuestro Proceso</a></li>
            <li class="nav-item"><a href="/slakidom/nosotros.html" class="nav-link">Sobre Nosotros</a></li>
            <li class="nav-item"><a href="/slakidom/contacto.html" class="nav-link">Contacto</a></li>
        </ul>
    </nav>
</header>

<!-- MENÚ FULL-SCREEN (Móvil) -->
<div class="menu-overlay" id="menuOverlay">
    <button class="menu-close" id="menuClose" aria-label="Cerrar menú">×</button>
    <nav class="menu-nav">
        <a href="/slakidom/index.html" class="menu-item">Inicio</a>
        
        <div class="menu-item-dropdown" id="menuProductosDropdown">
            <button class="menu-item menu-toggle-dropdown" id="menuProductosToggle">
                Productos <span class="dropdown-arrow">▼</span>
            </button>
            <ul class="menu-subnav">
                <li><a href="/slakidom/galletas/" class="menu-subitem">Galletas</a></li>
                <li><a href="/slakidom/mermeladas/" class="menu-subitem">Mermeladas</a></li>
            </ul>
        </div>

        <a href="/slakidom/proceso.html" class="menu-item">Nuestro Proceso</a>
        <a href="/slakidom/nosotros.html" class="menu-item">Sobre Nosotros</a>
        <a href="/slakidom/contacto.html" class="menu-item">Contacto</a>
    </nav>
</div>
