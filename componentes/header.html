<!-- HEADER / NAVEGACIÓN -->
<header class="header">
    <div class="logo-container">
        <a href="#" class="logo-link" title="Volver al inicio">
            <img src="img/slaky_logo.png" alt="SLAKIDOM Logo" class="logo">
        </a>
    </div>
    
    <div class="header-botones">
        <!-- Selector de moneda y Ubicación (izquierda) -->
        <div class="selector-moneda-wrapper">
            <button class="selector-moneda" id="selectorMoneda" aria-label="Cambiar moneda">
                <span class="bandera">🇻🇪</span>
                <span class="moneda-actual">Venezuela ($)</span>
                <span class="flecha">▼</span>
            </button>
            <div class="dropdown-monedas" id="dropdownMonedas">
                <div class="opcion-moneda seleccionada" data-moneda="USD" data-simbolo="$">
                    <span>💵</span>
                    <span>Dólares ($)</span>
                </div>
                <div class="opcion-moneda" data-moneda="VES" data-simbolo="Bs.">
                    <span>💰</span>
                    <span>Bolívares (Bs.)</span>
                </div>
            </div>
            <div class="ubicacion">
                <span class="icono-ubicacion">📍</span>
                <span>Caracas</span>
            </div>
        </div>
        
        <!-- Buscador (derecha) -->
        <div class="buscador-header">
            <input type="text" id="buscador-input" class="buscador-input" placeholder="Buscar..." aria-label="Buscar productos">
            <button class="buscador-btn" id="buscador-btn" aria-label="Buscar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- ✅ MENÚ HORIZONTAL INTEGRADO DENTRO DEL HEADER -->
    <nav class="nav-bar">
        <ul class="nav-list">
            <li class="nav-item">
                <a href="#productos" class="nav-link">Productos</a>
                <ul class="nav-dropdown">
                    <li><a href="#productos" class="dropdown-link" data-categoria="galletas">Galletas</a></li>
                    <li><a href="#productos" class="dropdown-link" data-categoria="mermeladas">Mermeladas</a></li>
                </ul>
            </li>
            <li class="nav-item"><a href="#proceso" class="nav-link">Nuestro Proceso</a></li>
            <li class="nav-item"><a href="#sobre-nosotros" class="nav-link">Sobre Nosotros</a></li>
            <li class="nav-item"><a href="#contacto" class="nav-link">Contacto</a></li>
        </ul>
    </nav>
</header>

<!-- MENÚ FULL-SCREEN (Móvil) -->
<div class="menu-overlay" id="menuOverlay">
    <button class="menu-close" id="menuClose" aria-label="Cerrar menú">×</button>
    <nav class="menu-nav">
        <a href="#" class="menu-item" data-target="inicio">Inicio</a>
        
        <div class="menu-item-dropdown" id="menuProductosDropdown">
            <button class="menu-item menu-toggle-dropdown" id="menuProductosToggle">
                Productos <span class="dropdown-arrow">▼</span>
            </button>
            <ul class="menu-subnav">
                <li><a href="#productos" class="menu-subitem" data-categoria="galletas">Galletas</a></li>
                <li><a href="#productos" class="menu-subitem" data-categoria="mermeladas">Mermeladas</a></li>
            </ul>
        </div>

        <a href="#proceso" class="menu-item" data-target="proceso">Nuestro Proceso</a>
        <a href="#sobre-nosotros" class="menu-item" data-target="sobre-nosotros">Sobre Nosotros</a>
        <a href="#contacto" class="menu-item" data-target="contacto">Contacto</a>
    </nav>
</div>
