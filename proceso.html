<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conoce cómo hacemos nuestras galletas y mermeladas artesanales - SLAKIDOM">
    <title>Nuestro Proceso - SLAKIDOM</title>
    
    <link rel="icon" type="image/png" href="img/slaky_cuadrado.jpg">
    
    <!-- CSS MODULAR (Actualizado con la nueva estructura) -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header.css">
    <link rel="stylesheet" href="css/11-menu.css">
    <link rel="stylesheet" href="css/06-proceso.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">
</head>
<body>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL HEADER -->
    <div id="header-container"></div>
    
    <main>
        <!-- SECCIÓN PROCESO -->
        <section id="proceso" class="proceso">
            <h2 class="section-title">Así Hacemos Nuestras Galletas</h2>
            <p class="section-subtitle">Cada paso lo hacemos con amor y dedicación</p>
            
            <div class="proceso-steps">
                <!-- ✅ Paso 1 -->
                <div class="paso">
                    <div class="paso-numero">1</div>
                    <h3>Seleccionamos</h3>
                    <p>Los mejores ingredientes frescos</p>
                </div>
                
                <!-- ✅ Paso 2 -->
                <div class="paso">
                    <div class="paso-numero">2</div>
                    <h3>Preparamos</h3>
                    <p>La masa con amor y dedicación</p>
                </div>
                
                <!-- ✅ Paso 3 -->
                <div class="paso">
                    <div class="paso-numero">3</div>
                    <h3>Horneamos</h3>
                    <p>Hasta obtener la textura perfecta</p>
                </div>
                
                <!-- ✅ Paso 4 -->
                <div class="paso">
                    <div class="paso-numero">4</div>
                    <h3>Empacamos</h3>
                    <p>Con cuidado para que lleguen perfectas</p>
                </div>
            </div>
        </section>
    </main>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL FOOTER -->
    <div id="footer-container"></div>

    <!-- ✅ SCRIPT PRINCIPAL -->
    <script type="module" src="js/app.js"></script>
    
</body>
</html>
