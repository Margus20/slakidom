<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galletas y mermeladas artesanales SLAKIDOM - Hechas con amor en Caracas">
    <title>SLAKIDOM - Galletas y Mermeladas Artesanales</title>
    
    <link rel="icon" type="image/png" href="img/slaky_cuadrado.jpg">
    
    <!-- CSS MODULAR -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header-menu.css">
    <link rel="stylesheet" href="css/04-hero.css">
    <link rel="stylesheet" href="css/05-productos.css">
    <link rel="stylesheet" href="css/06-proceso.css">
    <link rel="stylesheet" href="css/07-sobre-nosotros.css">
    <link rel="stylesheet" href="css/08-como-pedir.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">

    <!-- ✅ ESTILOS DEL SLIDER (Integrados para no crear archivos extra) -->
    <style>
        .hero-slider {
            position: relative;
            width: 100%;
            height: 60vh; /* Altura del slider en escritorio */
            min-height: 300px;
            overflow: hidden;
            background-color: #f4f1ea; /* Color de fondo por si la imagen tarda en cargar */
        }
        .slider-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out; /* Efecto suave de desvanecimiento */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide.active {
            opacity: 1;
            z-index: 1;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que la imagen cubra todo el espacio sin deformarse */
            object-position: center;
        }
        /* Puntos indicadores */
        .slider-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .dot.active {
            background-color: #fff;
            border-color: var(--chocolate, #5D4037); /* Usa el color chocolate de tus variables */
            transform: scale(1.2);
        }
        .dot:hover {
            background-color: rgba(255, 255, 255, 0.8);
        }
        /* Ajuste para móviles */
        @media (max-width: 768px) {
            .hero-slider {
                height: 40vh;
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL HEADER -->
    <div id="header-container"></div>
    
    <main>
        <!-- ✅ SLIDER DE IMÁGENES AUTOMÁTICO -->
        <section class="hero-slider">
            <div class="slider-container">
                <!-- Imagen 1 -->
                <div class="slide active">
                    <img src="img/navidad1.jpg" alt="Colección Navidad SLAKIDOM">
                </div>
                <!-- Imagen 2 -->
                <div class="slide">
                    <img src="img/logo-horizontal.jpg" alt="Logo SLAKIDOM">
                </div>
                <!-- Imagen 3 -->
                <div class="slide">
                    <img src="img/whatsapp-horizontal.jpg" alt="Contáctanos por WhatsApp">
                </div>
            </div>
            
            <!-- Indicadores (Puntitos) -->
            <div class="slider-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </section>
    </main>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL FOOTER Y ELEMENTOS GLOBALES -->
    <div id="footer-container"></div>

    <!-- ✅ SCRIPT PRINCIPAL DE LA APLICACIÓN -->
    <script type="module" src="js/app.js"></script>
    
    <!-- ✅ SCRIPT DEL SLIDER (Independiente, no daña app.js) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            let currentSlideIndex = 0;
            const slideInterval = 4000; // Cambia cada 4 segundos (4000 ms)

            function showSlide(index) {
                // Remover clase active de todos
                slides.forEach(slide => slide.classList.remove('active'));
                dots.forEach(dot => dot.classList.remove('active'));

                // Asegurar que el índice esté dentro de los límites
                if (index >= slides.length) currentSlideIndex = 0;
                else if (index < 0) currentSlideIndex = slides.length - 1;
                else currentSlideIndex = index;

                // Agregar clase active al actual
                slides[currentSlideIndex].classList.add('active');
                dots[currentSlideIndex].classList.add('active');
            }

            function nextSlide() {
                showSlide(currentSlideIndex + 1);
            }

            // Permitir clic en los puntos para cambiar manualmente
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    showSlide(index);
                });
            });

            // Iniciar el pase automático
            setInterval(nextSlide, slideInterval);
        });
    </script>
    
</body>
</html>
