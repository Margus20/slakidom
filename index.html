<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galletas y mermeladas artesanales SLAKIDOM - Hechas con amor en Caracas">
    <title>SLAKIDOM - Galletas y Mermeladas Artesanales</title>
    
    <link rel="icon" type="image/png" href="img/slaky_cuadrado.jpg">
    
    <!-- CSS MODULAR (Ordenado secuencialmente del 01 al 12) -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header.css">
    <link rel="stylesheet" href="css/04-hero.css">
    <link rel="stylesheet" href="css/05-productos.css">
    <link rel="stylesheet" href="css/06-proceso.css">
    <link rel="stylesheet" href="css/07-sobre-nosotros.css">
    <link rel="stylesheet" href="css/08-como-pedir.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">
    <link rel="stylesheet" href="css/11-menu.css">
    <link rel="stylesheet" href="css/12-slider.css">
</head>
<body>
    
    <!-- Aquí se inyectará el Header automáticamente -->
    <div id="header-container"></div>
    
    <main>
        <!-- Slider de Imágenes Automático -->
        <section class="hero-slider">
            <div class="slider-container">
                <div class="slide active">
                    <img src="img/navidad1.jpg" alt="Colección Navidad SLAKIDOM">
                </div>
                <div class="slide">
                    <img src="img/logohorizontal.jpg" alt="Logo SLAKIDOM">
                </div>
                <div class="slide">
                    <img src="img/whatsApphorizontal.jpg" alt="Contáctanos por WhatsApp">
                </div>
            </div>
            
            <!-- Indicadores (Puntitos) -->
            <div class="slider-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </section>
    </main>
    
    <!-- Aquí se inyectará el Footer automáticamente -->
    <div id="footer-container"></div>

    <!-- ✅ CONSOLA DE DESARROLLADOR PARA TABLET (Eruda) - Versión mejorada -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        // Inicializar Eruda con herramientas extendidas para ver errores específicos
        eruda.init({
            defaults: {
                display: {
                    console: true,
                    elements: true,
                    network: true,
                    resources: true,
                    sources: true
                }
            }
        });
        console.log('[INFO] Consola Eruda cargada. Revisa las pestañas "Network" y "Sources" para ver detalles del error.');
    </script>

    <!-- Único script: El cerebro de la aplicación -->
    <script type="module" src="js/app.js"></script>
    
</body>
</html>
