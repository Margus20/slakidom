<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galletas y mermeladas artesanales SLAKIDOM - Hechas con amor en Caracas">
    <title>SLAKIDOM - Galletas y Mermeladas Artesanales</title>
    
    <link rel="icon" type="image/png" href="img/slaky_cuadrado.jpg">
    
    <!-- CSS MODULAR -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header-menu.css">
    <link rel="stylesheet" href="css/04-hero.css">
    <link rel="stylesheet" href="css/05-productos.css">
    <link rel="stylesheet" href="css/06-proceso.css">
    <link rel="stylesheet" href="css/07-sobre-nosotros.css">
    <link rel="stylesheet" href="css/08-como-pedir.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">

    <!-- ✅ ESTILOS DEL SLIDER CON EFECTO DESLIZANTE Y FONDO DIFUMINADO -->
    <style>
        .hero-slider {
            position: relative;
            width: 100%;
            height: auto;
            min-height: 250px;
            overflow: hidden;
            background-color: #f4f1ea;
        }
        
        /* Fondo difuminado con textura */
        .hero-slider::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('img/navidad1.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.6); /* Desenfoque y oscurecimiento suave */
            transform: scale(1.1); /* Evita bordes blancos por el efecto blur */
            z-index: 0;
            opacity: 0.5;
        }
        
        .slider-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Ratio 16:9 para imágenes horizontales */
            height: 0;
            overflow: hidden;
            z-index: 1; /* Se coloca por encima del fondo difuminado */
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%); /* Empieza fuera, a la derecha */
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0); /* Posición central visible */
            z-index: 2;
        }
        
        .slide.exit {
            transform: translateX(-100%); /* Sale deslizándose hacia la izquierda */
            opacity: 0;
            z-index: 1;
        }
        
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Muestra la imagen completa sin cortar */
            object-position: center;
        }
        
        /* Puntos indicadores */
        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background-color: var(--chocolate, #5D4037);
            transform: scale(1.3);
        }
        
        /* Desktop: más compacto */
        @media (min-width: 1024px) {
            .slider-container {
                padding-top: 45%;
                min-height: 400px;
            }
        }
        
        /* Tablet */
        @media (min-width: 768px) and (max-width: 1023px) {
            .slider-container {
                padding-top: 60%;
                min-height: 300px;
            }
            .hero-slider::before {
                filter: blur(6px) brightness(0.6);
            }
        }
        
        /* Móvil */
        @media (max-width: 767px) {
            .hero-slider {
                min-height: 200px;
            }
            .slider-container {
                padding-top: 75%; /* Más alto en móvil para ver bien la imagen horizontal */
            }
            .slider-dots {
                bottom: 10px;
            }
            .dot {
                width: 8px;
                height: 8px;
            }
            .hero-slider::before {
                filter: blur(4px) brightness(0.5); /* Menos blur en móvil para rendimiento */
            }
        }
    </style>
</head>
<body>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL HEADER -->
    <div id="header-container"></div>
    
    <main>
        <!-- ✅ SLIDER DE IMÁGENES AUTOMÁTICO -->
        <section class="hero-slider">
            <div class="slider-container">
                <!-- Imagen 1 -->
                <div class="slide active">
                    <img src="img/navidad1.jpg" alt="Colección Navidad SLAKIDOM">
                </div>
                <!-- Imagen 2 -->
                <div class="slide">
                    <img src="img/logohorizontal.jpg" alt="Logo SLAKIDOM">
                </div>
                <!-- Imagen 3 -->
                <div class="slide">
                    <img src="img/whatsApphorizontal.jpg" alt="Contáctanos por WhatsApp">
                </div>
            </div>
            
            <!-- Indicadores (Puntitos) -->
            <div class="slider-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </section>
    </main>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL FOOTER Y ELEMENTOS GLOBALES -->
    <div id="footer-container"></div>

    <!-- ✅ SCRIPT PRINCIPAL DE LA APLICACIÓN -->
    <script type="module" src="js/app.js"></script>
    
    <!-- ✅ SCRIPT DEL SLIDER (Con lógica de deslizamiento) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            let currentSlideIndex = 0;
            let previousSlideIndex = 0;
            const slideInterval = 5000; // Cambia cada 5 segundos

            function showSlide(index) {
                // 1. La diapositiva actual se marca para salir hacia la izquierda
                slides[previousSlideIndex].classList.remove('active');
                slides[previousSlideIndex].classList.add('exit');
                
                // 2. Limpiar la clase 'exit' después de la animación (800ms)
                setTimeout(() => {
                    slides[previousSlideIndex].classList.remove('exit');
                }, 800);

                // 3. Actualizar índices
                previousSlideIndex = currentSlideIndex;
                if (index >= slides.length) currentSlideIndex = 0;
                else if (index < 0) currentSlideIndex = slides.length - 1;
                else currentSlideIndex = index;

                // 4. Activar la nueva diapositiva (entra desde la derecha por CSS)
                slides[currentSlideIndex].classList.add('active');
                
                // 5. Actualizar puntos indicadores
                dots.forEach(dot => dot.classList.remove('active'));
                dots[currentSlideIndex].classList.add('active');
            }

            function nextSlide() {
                showSlide(currentSlideIndex + 1);
            }

            // Permitir clic en los puntos para navegación manual
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    showSlide(index);
                });
            });

            // Iniciar el pase automático
            setInterval(nextSlide, slideInterval);
        });
    </script>
    
</body>
</html>
